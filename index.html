<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Send Phone Number</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 10px;
    }
    .card {
      background: #222;
      padding: 20px 25px;
      border-radius: 8px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #eee;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
    .note {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
    }
    .status.ok {
      color: #4caf50;
    }
    .status.error {
      color: #ff5252;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send Phone Number</h1>
    <form id="sendForm">
      <label for="number">10-digit phone number:</label>
      <input
        id="number"
        name="number"
        type="text"
        maxlength="10"
        inputmode="numeric"
        autocomplete="off"
        required
      />
      <button type="submit">Submit</button>
      <p class="note">
        Only 10 digits allowed. Example: <code>5551234567</code>
      </p>
      <div id="status" class="status"></div>
    </form>
  </div>

  <script>
    // 🔧 CHANGE THIS TO YOUR REAL NGROK URL:
    const NGROK_URL = "https://YOUR_NGROK_URL_HERE/submit";

    const form = document.getElementById("sendForm");
    const numberInput = document.getElementById("number");
    const statusEl = document.getElementById("status");

    // Enforce only digits on the client side
    numberInput.addEventListener("input", () => {
      numberInput.value = numberInput.value.replace(/\D/g, "").slice(0, 10);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "status";

      const number = numberInput.value.trim();

      // Basic validation: exactly 10 digits
      if (!/^\d{10}$/.test(number)) {
        statusEl.textContent = "Please enter exactly 10 digits.";
        statusEl.classList.add("error");
        return;
      }

      try {
        const params = new URLSearchParams();
        params.append("number", number);

        const res = await fetch(NGROK_URL, {
          method: "POST",
          body: params
        });

        if (res.ok) {
          const text = await res.text();
          if (text.includes("already")) {
            statusEl.textContent = "That number was already submitted.";
          } else {
            statusEl.textContent = "Number submitted successfully.";
          }
          statusEl.classList.add("ok");
          form.reset();  // clear the input so they can send another
        } else {
          statusEl.textContent = "Error submitting number. Try again.";
          statusEl.classList.add("error");
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Connection error. Is your server running?";
        statusEl.classList.add("error");
      }
    });
  </script>
</body>
</html>
