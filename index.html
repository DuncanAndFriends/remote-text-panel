<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Call Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 10px;
    }
    .card {
      background: #222;
      padding: 20px 25px;
      border-radius: 8px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #eee;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #218838;
    }
    .end-btn {
      background: #d32f2f;
    }
    .end-btn:hover {
      background: #c62828;
    }
    .note {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      min-height: 18px;
    }
    .status.ok {
      color: #4caf50;
    }
    .status.error {
      color: #ff5252;
    }
  </style>
</head>
<body>

  <!-- NUMBER SUBMIT -->
  <div class="card">
    <h1>Send Phone Number</h1>
    <form id="sendForm">
      <label for="number">10-digit phone number:</label>
      <input
        id="number"
        name="number"
        type="text"
        maxlength="10"
        inputmode="numeric"
        autocomplete="off"
        required
      />
      <button type="submit">Submit Number</button>
      <p class="note">
        Only 10 digits allowed. Duplicate numbers are ignored.
      </p>
      <div id="status" class="status"></div>
    </form>
  </div>

  <!-- END-CALL VOTE -->
  <div class="card">
    <h2>End Call Vote</h2>
    <p class="note">
      When 3 unique IPs press this button, the app will send ESC to the softphone to end the call.
    </p>
    <button class="end-btn" id="endCallBtn">Vote to End Call</button>
    <div id="endStatus" class="status"></div>
  </div>

  <script>
    // 🔧 Change this if ngrok gives you a new URL:
    const NGROK_BASE = "https://ritualistically-depictive-hana.ngrok-free.dev";
    const SUBMIT_URL = NGROK_BASE + "/submit";
    const PAD_URL    = NGROK_BASE + "/pad";

    const form        = document.getElementById("sendForm");
    const numberInput = document.getElementById("number");
    const statusEl    = document.getElementById("status");

    const endCallBtn  = document.getElementById("endCallBtn");
    const endStatusEl = document.getElementById("endStatus");

    // Only allow digits in the main number input
    numberInput.addEventListener("input", () => {
      numberInput.value = numberInput.value.replace(/\D/g, "").slice(0, 10);
    });

    // Handle number submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      statusEl.textContent = "";
      statusEl.className = "status";

      const number = numberInput.value.trim();
      if (!/^\d{10}$/.test(number)) {
        statusEl.textContent = "Enter exactly 10 digits.";
        statusEl.classList.add("error");
        return;
      }

      try {
        const params = new URLSearchParams();
        params.append("number", number);

        const res = await fetch(SUBMIT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString()
        });

        const text = await res.text();

        if (!res.ok) {
          statusEl.textContent = text || "Error submitting number.";
          statusEl.classList.add("error");
          return;
        }

        if (text.toLowerCase().includes("already")) {
          statusEl.textContent = "That number was already submitted.";
        } else {
          statusEl.textContent = "Number submitted successfully.";
        }
        statusEl.classList.add("ok");
        form.reset();

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Connection error. Is your server running?";
        statusEl.classList.add("error");
      }
    });

    // Handle end-call vote
    endCallBtn.addEventListener("click", async () => {
      endStatusEl.textContent = "";
      endStatusEl.className = "status";

      try {
        const params = new URLSearchParams();
        params.append("action", "end");

        const res = await fetch(PAD_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString()
        });

        const text = await res.text();

        if (!res.ok) {
          endStatusEl.textContent = text || "Error sending vote.";
          endStatusEl.classList.add("error");
          return;
        }

        endStatusEl.textContent = text;
        endStatusEl.classList.add("ok");

      } catch (err) {
        console.error(err);
        endStatusEl.textContent = "Connection error. Is your server running?";
        endStatusEl.classList.add("error");
      }
    });
  </script>
</body>
</html>
