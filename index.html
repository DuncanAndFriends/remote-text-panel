<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Text Sender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 10px;
    }
    .card {
      background: #222;
      padding: 20px 25px;
      border-radius: 8px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #eee;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
    .note {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send Command / Text</h1>
    <form id="sendForm" method="POST" action="https://ritualistically-depictive-hana.ngrok-free.dev -> http://localhost:5000">
      <label for="message">Message or command:</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit">Send</button>
      <p class="note">
        Example commands: <code>CALL 5551234</code>, <code>HANGUP</code>, or any text.
      </p>
    </form>
  </div>
</body>
</html>
