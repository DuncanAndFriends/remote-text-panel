<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Dialer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 10px;
    }
    .card {
      background: #222;
      padding: 20px 25px;
      border-radius: 8px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #eee;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #218838;
    }
    .note {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      min-height: 18px;
    }
    .status.ok {
      color: #4caf50;
    }
    .status.error {
      color: #ff5252;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 10px;
      margin-top: 10px;
    }
    .keypad button {
      width: 100%;
      padding: 15px 0;
      font-size: 18px;
      background: #333;
    }
    .keypad button:hover {
      background: #444;
    }
    .end-call {
      width: 100%;
      margin-top: 15px;
      background: #d32f2f;
    }
    .end-call:hover {
      background: #c62828;
    }
  </style>
</head>
<body>

  <!-- NUMBER SUBMIT -->
  <div class="card">
    <h1>Send Phone Number</h1>
    <form id="sendForm">
      <label for="number">10-digit phone number:</label>
      <input
        id="number"
        name="number"
        type="text"
        maxlength="10"
        inputmode="numeric"
        autocomplete="off"
        required
      />
      <button type="submit">Submit Number</button>
      <p class="note">
        Only 10 digits allowed. Duplicates are ignored.
      </p>
      <div id="status" class="status"></div>
    </form>
  </div>

  <!-- REMOTE KEYPAD -->
  <div class="card">
    <h2>Remote Keypad</h2>
    <div class="keypad" id="keypad">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="*">*</button>
      <button data-key="0">0</button>
      <button data-key="#">#</button>
    </div>
    <button class="end-call" id="endCallBtn">End Call (3-Vote)</button>
    <div id="padStatus" class="status"></div>
  </div>

  <script>
    // ✅ YOUR NGROK URL IS NOW LOCKED IN
    const NGROK_BASE = "https://ritualistically-depictive-hana.ngrok-free.dev/submit";
    const SUBMIT_URL = NGROK_BASE + "/submit";
    const PAD_URL    = NGROK_BASE + "/pad";

    const form = document.getElementById("sendForm");
    const numberInput = document.getElementById("number");
    const statusEl = document.getElementById("status");

    const keypad = document.getElementById("keypad");
    const padStatusEl = document.getElementById("padStatus");
    const endCallBtn = document.getElementById("endCallBtn");

    numberInput.addEventListener("input", () => {
      numberInput.value = numberInput.value.replace(/\D/g, "").slice(0, 10);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "status";

      const number = numberInput.value.trim();
      if (!/^\d{10}$/.test(number)) {
        statusEl.textContent = "Enter exactly 10 digits.";
        statusEl.classList.add("error");
        return;
      }

      try {
        const params = new URLSearchParams();
        params.append("number", number);

        const res = await fetch(SUBMIT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString()
        });

        const text = await res.text();

        if (text.toLowerCase().includes("already")) {
          statusEl.textContent = "Duplicate ignored.";
        } else {
          statusEl.textContent = "Number submitted.";
        }

        statusEl.classList.add("ok");
        form.reset();

      } catch {
        statusEl.textContent = "Connection error.";
        statusEl.classList.add("error");
      }
    });

    keypad.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-key]");
      if (!btn) return;

      const key = btn.dataset.key;

      try {
        const params = new URLSearchParams();
        params.append("action", "digit");
        params.append("key", key);

        const res = await fetch(PAD_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString()
        });

        const text = await res.text();
        padStatusEl.textContent = text;
        padStatusEl.className = "status ok";

      } catch {
        padStatusEl.textContent = "Pad offline.";
        padStatusEl.className = "status error";
      }
    });

    endCallBtn.addEventListener("click", async () => {
      try {
        const params = new URLSearchParams();
        params.append("action", "end");

        const res = await fetch(PAD_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params.toString()
        });

        const text = await res.text();
        padStatusEl.textContent = text;
        padStatusEl.className = "status ok";

      } catch {
        padStatusEl.textContent = "Pad offline.";
        padStatusEl.className = "status error";
      }
    });
  </script>
</body>
</html>
